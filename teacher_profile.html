<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - TinkerLab Admin View</title>
    <link rel="stylesheet" href="teacher_profile.css">
</head>
<body>

    <!-- Left Sidebar -->
    <aside class="sidebar">
        <!-- Logo & Header -->
        <div class="brand">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"></path>
                    <line x1="8.5" y1="2" x2="15.5" y2="2"></line>
                    <path d="M7 16h10"></path>
                </svg>
            </div>
            <div class="brand-text">
                <h2>TinkerLab</h2>
                <p>Inventory System</p>
            </div>
        </div>

        <!-- Navigation Links -->
        <nav class="nav-menu">
            <a href="teacher_dashboard.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                </svg>
                <span>Dashboard</span>
            </a>

            <a href="teacher_requests.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <line x1="10" y1="9" x2="8" y2="9"></line>
                </svg>
                <span>Requests</span>
            </a>

            <a href="teacher_inventory.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                <span>Inventory</span>
            </a>

            <a href="teacher_history.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>History</span>
            </a>

            <a href="teacher_profile.html" class="nav-item active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Profile</span>
            </a>
        </nav>

        <!-- Logged In User Card -->
        <div class="user-profile-badge">
            <span class="user-role-label">Logged in as</span>
            <span class="user-name">Dr. Meera Krishnan</span>
            <span class="user-id">Lab Administrator</span>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <!-- Top Header Bar (No notification icon) -->
        <header class="top-header">
            <div class="header-left">
                <span class="header-breadcrumb">My Profile</span>
            </div>
            <div class="header-right">
                <a href="student.html" class="switch-view-btn">
                    <span>Switch to:</span>
                    <strong class="student-highlight">Student View</strong>
                </a>
            </div>
        </header>

        <!-- Main Body Content -->
        <main class="content-container">
            <div class="page-title-row">
                <h1 class="page-title">My Profile</h1>
            </div>

            <!-- Profile Header Card (Top) -->
            <div class="profile-header-card">
                <div class="profile-banner"></div>
                <div class="profile-header-body">
                    <div class="profile-avatar-row">
                        <div class="profile-avatar" id="avatarInitials">MK</div>
                        <button class="btn-edit-profile" id="btnEditProfile" onclick="toggleEditMode()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                            Edit Profile
                        </button>
                    </div>
                    <h2 class="profile-name" id="displayProfileName">Dr. Meera Krishnan</h2>
                    <p class="profile-role-dept" id="displayProfileDept">Lab Administrator &bull; Electronics Tinkering Lab</p>
                </div>
            </div>

            <!-- Account Information Card (Bottom) -->
            <div class="profile-info-card">
                <h3 class="profile-info-title">Account Information</h3>
                <form id="profileForm" onsubmit="saveProfileChanges(event)">
                    <div class="profile-form-grid">
                        <div class="profile-field-group">
                            <label class="profile-label" for="inputFullName">Full Name</label>
                            <input type="text" class="profile-input" id="inputFullName" value="Dr. Meera Krishnan" readonly required>
                        </div>

                        <div class="profile-field-group">
                            <label class="profile-label" for="inputEmployeeId">Employee ID</label>
                            <input type="text" class="profile-input" id="inputEmployeeId" value="ECE-FAC-012" readonly required>
                        </div>

                        <div class="profile-field-group">
                            <label class="profile-label" for="inputEmail">Institute Email</label>
                            <input type="email" class="profile-input" id="inputEmail" value="meera.k@nitk.edu.in" readonly required>
                        </div>

                        <div class="profile-field-group">
                            <label class="profile-label" for="inputDepartment">Department</label>
                            <input type="text" class="profile-input" id="inputDepartment" value="Electronics & Communication Engineering" readonly required>
                        </div>

                        <div class="profile-field-group">
                            <label class="profile-label" for="inputPhone">Phone</label>
                            <input type="tel" class="profile-input" id="inputPhone" value="+91 99887 65432" readonly required>
                        </div>

                        <div class="profile-edit-actions" id="editActions" style="display: none;">
                            <button type="submit" class="btn-save-profile">Save Changes</button>
                            <button type="button" class="btn-cancel-profile" onclick="cancelEditMode()">Cancel</button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div class="toast-notice" id="toastNotice">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="toastMessage">Profile updated successfully!</span>
    </div>

    <script>
        const DEFAULT_TEACHER_PROFILE = {
            fullName: 'Dr. Meera Krishnan',
            email: 'meera.k@nitk.edu.in',
            department: 'Electronics & Communication Engineering',
            employeeId: 'ECE-FAC-012',
            phone: '+91 99887 65432'
        };

        let isEditing = false;

        function getProfile() {
            try {
                return Object.assign({}, DEFAULT_TEACHER_PROFILE, JSON.parse(localStorage.getItem('tinkerlab_teacher_profile') || '{}'));
            } catch (e) {
                return DEFAULT_TEACHER_PROFILE;
            }
        }

        function getInitials(name) {
            const parts = name.trim().split(/\s+/).filter(p => !p.startsWith('Dr.') && !p.startsWith('Prof.'));
            if (parts.length >= 2) {
                return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
            } else if (parts.length === 1) {
                return parts[0].substring(0, 2).toUpperCase();
            }
            return 'MK';
        }

        function loadProfile() {
            const p = getProfile();
            document.getElementById('inputFullName').value = p.fullName;
            document.getElementById('inputEmail').value = p.email;
            document.getElementById('inputDepartment').value = p.department;
            document.getElementById('inputEmployeeId').value = p.employeeId;
            document.getElementById('inputPhone').value = p.phone;

            document.getElementById('displayProfileName').textContent = p.fullName;
            document.getElementById('displayProfileDept').innerHTML = `Lab Administrator &bull; ${p.department}`;
            document.getElementById('avatarInitials').textContent = getInitials(p.fullName);
        }

        function toggleEditMode() {
            isEditing = !isEditing;
            const inputs = document.querySelectorAll('.profile-input');
            const editActions = document.getElementById('editActions');
            const btnEdit = document.getElementById('btnEditProfile');

            if (isEditing) {
                inputs.forEach(input => {
                    input.removeAttribute('readonly');
                    input.classList.add('editable');
                });
                editActions.style.display = 'flex';
                btnEdit.style.display = 'none';
                document.getElementById('inputFullName').focus();
            } else {
                cancelEditMode();
            }
        }

        function cancelEditMode() {
            isEditing = false;
            const inputs = document.querySelectorAll('.profile-input');
            const editActions = document.getElementById('editActions');
            const btnEdit = document.getElementById('btnEditProfile');

            inputs.forEach(input => {
                input.setAttribute('readonly', 'true');
                input.classList.remove('editable');
            });
            editActions.style.display = 'none';
            btnEdit.style.display = 'inline-flex';
            loadProfile();
        }

        function saveProfileChanges(e) {
            e.preventDefault();
            const updated = {
                fullName: document.getElementById('inputFullName').value.trim(),
                email: document.getElementById('inputEmail').value.trim(),
                department: document.getElementById('inputDepartment').value.trim(),
                employeeId: document.getElementById('inputEmployeeId').value.trim(),
                phone: document.getElementById('inputPhone').value.trim()
            };

            localStorage.setItem('tinkerlab_teacher_profile', JSON.stringify(updated));

            isEditing = false;
            const inputs = document.querySelectorAll('.profile-input');
            inputs.forEach(input => {
                input.setAttribute('readonly', 'true');
                input.classList.remove('editable');
            });
            document.getElementById('editActions').style.display = 'none';
            document.getElementById('btnEditProfile').style.display = 'inline-flex';

            loadProfile();
            showToast('Profile updated successfully!');
        }

        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toastNotice');
            document.getElementById('toastMessage').textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>

</body>
</html>
