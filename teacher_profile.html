<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - TinkerLab Admin View</title>
    <link rel="stylesheet" href="teacher_profile.css">
</head>
<body>

    <!-- Left Sidebar -->
    <aside class="sidebar">
        <!-- Logo & Header -->
        <div class="brand">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"></path>
                    <line x1="8.5" y1="2" x2="15.5" y2="2"></line>
                    <path d="M7 16h10"></path>
                </svg>
            </div>
            <div class="brand-text">
                <h2>TinkerLab</h2>
                <p>Inventory System</p>
            </div>
        </div>

        <!-- Navigation Links -->
        <nav class="nav-menu">
            <a href="teacher_dashboard.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                </svg>
                <span>Dashboard</span>
            </a>

            <a href="teacher_requests.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <line x1="10" y1="9" x2="8" y2="9"></line>
                </svg>
                <span>Requests</span>
            </a>

            <a href="teacher_inventory.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                <span>Inventory</span>
            </a>

            <a href="teacher_history.html" class="nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>History</span>
            </a>

            <a href="teacher_profile.html" class="nav-item active">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Profile</span>
            </a>
        </nav>

        <!-- Logged In User Card -->
        <div class="user-profile-badge">
            <span class="user-role-label">Logged in as</span>
            <span class="user-name">Dr. Meera Krishnan</span>
            <span class="user-id">Lab Administrator</span>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <!-- Top Header Bar -->
        <header class="top-header">
            <div class="header-left">
                <span class="header-breadcrumb">My Profile</span>
            </div>
            <div class="header-right">
                <a href="student.html" class="switch-view-btn">
                    <span>Switch to:</span>
                    <span class="student-highlight">Student View</span>
                </a>
                <button class="notification-bell-btn" title="Notifications" aria-label="Notifications">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="notification-dot"></span>
                </button>
            </div>
        </header>

        <!-- Main Body Content -->
        <main class="content-container">
            <h1 class="page-title">My Profile</h1>

            <div class="profile-layout-wrapper">
                <!-- Profile Header Banner Card -->
                <div class="profile-header-card">
                    <div class="profile-banner"></div>
                    <div class="profile-card-body">
                        <div class="profile-avatar-box">MK</div>
                        <h2 class="profile-name">Dr. Meera Krishnan</h2>
                        <p class="profile-subtitle">Lab Administrator &middot; Electronics Tinkering Lab</p>
                    </div>
                </div>

                <!-- Account Information Card -->
                <div class="profile-form-card">
                    <h3 class="form-section-title">Account Information</h3>
                    <form class="profile-form" onsubmit="event.preventDefault(); alert('Profile updated successfully!');">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" name="fullName" value="Dr. Meera Krishnan" class="form-input">
                        </div>

                        <div class="form-group">
                            <label for="instituteEmail">Institute Email</label>
                            <input type="email" id="instituteEmail" name="instituteEmail" value="meera.k@nitk.edu.in" class="form-input">
                        </div>

                        <div class="form-group">
                            <label for="department">Department</label>
                            <input type="text" id="department" name="department" value="Electronics & Communication Engineering" class="form-input">
                        </div>

                        <div class="form-group">
                            <label for="employeeId">Employee ID</label>
                            <input type="text" id="employeeId" name="employeeId" value="ECE-FAC-012" class="form-input">
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="text" id="phone" name="phone" value="+91 99887 65432" class="form-input">
                        </div>

                        <div class="form-action">
                            <button type="submit" class="btn-save-changes">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Floating Help Button -->
    <button class="help-floating-btn" title="Help & Support" aria-label="Help">?</button>

</body>
</html>
